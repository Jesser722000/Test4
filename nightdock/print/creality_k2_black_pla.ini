# PrusaSlicer profile: Creality K2 Plus / K2 Pro, 0.4 mm nozzle, black PLA, 0.2 mm
# (bed set to 300 x 300 so the same G-code runs on both the K2 Pro and K2 Plus)
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 300
gcode_flavor = klipper
printer_notes = Creality K2
nozzle_diameter = 0.4
use_relative_e_distances = 1
start_gcode = START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]\nT0\nM109 S[first_layer_temperature]\nG90\nM83
end_gcode = END_PRINT
gcode_label_objects = disabled
thumbnails =

filament_type = PLA
filament_colour = #000000
filament_diameter = 1.75
filament_max_volumetric_speed = 20
temperature = 220
first_layer_temperature = 225
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 4
min_print_speed = 20
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2

layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
support_material = 0
seam_position = rear
external_perimeters_first = 0
skirts = 1
skirt_distance = 6
brim_width = 4
brim_separation = 0.15
brim_type = outer_only

first_layer_speed = 50
external_perimeter_speed = 150
perimeter_speed = 250
small_perimeter_speed = 100
infill_speed = 300
solid_infill_speed = 250
top_solid_infill_speed = 150
gap_fill_speed = 150
bridge_speed = 50
travel_speed = 500
default_acceleration = 8000
external_perimeter_acceleration = 5000
perimeter_acceleration = 6000
infill_acceleration = 10000
solid_infill_acceleration = 8000
top_solid_infill_acceleration = 5000
bridge_acceleration = 3000
first_layer_acceleration = 2000
travel_acceleration = 12000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_feedrate_x = 600
machine_max_feedrate_y = 600
machine_limits_usage = time_estimate_only
autoemit_temperature_commands = 0
